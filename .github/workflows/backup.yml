name: Database Backup

# Sauvegarde quotidienne de la base Postgres (reprise après incident : mauvaise
# migration, panne Neon... ) vers un dépôt privé dédié, séparé de Neon.
# Le contenu sensible du vault est déjà chiffré côté client (AES-256-GCM) avant
# d'arriver en base - ce dump n'est donc pas une nouvelle surface de risque pour
# le contenu des vaults, mais il contient des emails et adresses IP en clair
# (AuditLog), d'où le chiffrement du fichier avant de le pousser.

on:
  schedule:
    - cron: "0 3 * * *"  # tous les jours à 3h00 UTC
  workflow_dispatch: {}   # déclenchement manuel depuis l'onglet Actions

# Le dépôt de sauvegarde est atteint avec BACKUP_REPO_TOKEN : le GITHUB_TOKEN
# de ce workflow n'a besoin d'aucune permission.
permissions: {}

# Deux sauvegardes simultanées se disputeraient le push.
concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        # pg_dump refuse de sauvegarder un serveur plus récent que lui-même -
        # le client par défaut d'Ubuntu (16) est trop ancien pour Neon (Postgres
        # 18). Le paquet "postgresql-client" sans numéro de version résout quand
        # même vers la 16 (celle déjà connue d'Ubuntu) même avec le dépôt PGDG
        # ajouté - il faut cibler explicitement la version majeure voulue.
        # ⚠️ Si Neon monte un jour vers Postgres 19+, remonter ce numéro ici.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Dump database
        # Chemin explicite plutôt que la commande "pg_dump" nue : sur les
        # runners GitHub, /usr/bin/pg_dump continue de pointer vers la version
        # 16 déjà présente sur l'image même après avoir installé la 18 à côté
        # (contrairement à une image Ubuntu propre) - le binaire versionné, lui,
        # est garanti d'exister à ce chemin une fois postgresql-client-18 installé.
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_DIRECT_URL" --format=custom --no-owner --no-privileges -f backup.dump

      - name: Encrypt dump
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        # Passphrase lue sur l'entrée standard (printf est une commande interne
        # du shell) : passée en argument, elle serait visible dans la liste
        # des processus du runner.
        run: |
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --symmetric --cipher-algo AES256 \
              -o backup.dump.gpg backup.dump
          rm backup.dump

      - name: Push to backup repository
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REPO: OrionPrt/aegis-backups
          # Variable du dépôt (Settings → Secrets and variables → Actions →
          # Variables). Vide : tout est conservé. Un nombre de jours : les
          # dumps plus anciens sont supprimés ET l'historique du dépôt de
          # sauvegarde est réécrit, pour qu'un compte supprimé disparaisse
          # vraiment des sauvegardes (voir BACKUP.md).
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS }}
          # Garde-fou : jamais moins de dumps que ça, quelle que soit leur date.
          BACKUP_KEEP_AT_LEAST: "7"
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          # Jeton passé en en-tête plutôt que dans l'URL du dépôt.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$BACKUP_REPO_TOKEN" | base64 -w0)"
          git -c http.extraHeader="$AUTH_HEADER" clone "https://github.com/${BACKUP_REPO}.git" backup-repo
          mkdir -p backup-repo/backups
          mv backup.dump.gpg "backup-repo/backups/${TIMESTAMP}.dump.gpg"
          cd backup-repo
          git config http.extraHeader "$AUTH_HEADER"
          git config user.name "aegis-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "backups/${TIMESTAMP}.dump.gpg"

          if [ -z "${BACKUP_RETENTION_DAYS:-}" ]; then
            git commit -m "backup: ${TIMESTAMP}"
            git push
            exit 0
          fi

          # Les noms sont des dates ISO : l'ordre alphabétique est l'ordre
          # chronologique. Les BACKUP_KEEP_AT_LEAST plus récents sont gardés.
          CUTOFF=$(date -u -d "-${BACKUP_RETENTION_DAYS} days" +"%Y-%m-%dT%H-%M-%SZ")
          ls backups/*.dump.gpg | sort | head -n -"${BACKUP_KEEP_AT_LEAST}" | while read -r dump; do
            if [[ "$(basename "$dump" .dump.gpg)" < "$CUTOFF" ]]; then
              git rm --quiet "$dump"
            fi
          done

          # Un seul commit contenant les dumps conservés : les anciens ne
          # restent pas dans l'historique.
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git checkout --quiet --orphan retained
          git commit --quiet -m "backup: ${TIMESTAMP} (rétention ${BACKUP_RETENTION_DAYS} jours)"
          git push --force origin "retained:${BRANCH}"
